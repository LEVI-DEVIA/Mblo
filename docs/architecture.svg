<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Architecture Mblo sur Azure">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A231E"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E7A4C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="880" fill="#FFFFFF"/>

  <!-- Azure region -->
  <rect x="40" y="175" width="1320" height="520" rx="10" fill="#EEF3FB" stroke="#2F5FA8" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text x="56" y="203" font-size="13" font-weight="700" fill="#2F5FA8" letter-spacing="1.5">AZURE · FRANCE CENTRAL</text>
  <text x="940" y="678" font-size="13" fill="#5B6660">Azure Monitor : logs et alertes infra</text>

  <!-- boxes -->
  <g stroke="#C7D0C9" stroke-width="1.4" fill="#FFFFFF">
    <rect x="50"   y="50"  width="220" height="76" rx="6" stroke="#1E7A4C" stroke-width="2"/>
    <rect x="370"  y="50"  width="210" height="76" rx="6" stroke="#1E7A4C" stroke-width="2"/>
    <rect x="620"  y="50"  width="230" height="76" rx="6"/>
    <rect x="900"  y="50"  width="210" height="76" rx="6"/>
    <rect x="1150" y="50"  width="200" height="76" rx="6"/>

    <rect x="50"   y="225" width="240" height="100" rx="6"/>
    <rect x="370"  y="225" width="370" height="165" rx="6" stroke="#2F5FA8" stroke-width="2.2"/>
    <rect x="50"   y="370" width="240" height="140" rx="6"/>
    <rect x="50"   y="560" width="240" height="80"  rx="6"/>
    <rect x="370"  y="500" width="370" height="140" rx="6" stroke="#2F5FA8" stroke-width="2.2"/>
    <rect x="940"  y="370" width="240" height="90"  rx="6"/>
    <rect x="940"  y="520" width="380" height="115" rx="6"/>

    <rect x="940"  y="775" width="180" height="70" rx="6"/>
    <rect x="1150" y="775" width="200" height="70" rx="6"/>
  </g>

  <!-- arrows: citizen path -->
  <g fill="none" stroke="#1E7A4C" stroke-width="2">
    <line x1="270" y1="88" x2="370" y2="88" marker-start="url(#arg)" marker-end="url(#arg)"/>
    <line x1="430" y1="126" x2="430" y2="225" marker-end="url(#arg)"/>
    <line x1="520" y1="225" x2="520" y2="126" marker-end="url(#arg)"/>
    <polyline points="160,50 160,26 735,26 735,50" marker-end="url(#arg)"/>
  </g>
  <!-- arrows: rest -->
  <g fill="none" stroke="#1A231E" stroke-width="1.5">
    <line x1="700" y1="126" x2="700" y2="225" marker-end="url(#ar)"/>
    <polyline points="740,270 1005,270 1005,126" marker-end="url(#ar)"/>
    <polyline points="740,320 1250,320 1250,126" marker-end="url(#ar)"/>
    <line x1="555" y1="390" x2="555" y2="500" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <line x1="290" y1="275" x2="370" y2="275" marker-end="url(#ar)"/>
    <polyline points="290,440 330,440 330,570 370,570" marker-end="url(#ar)"/>
    <line x1="940" y1="575" x2="740" y2="575" marker-end="url(#ar)"/>
    <line x1="1060" y1="520" x2="1060" y2="460" marker-end="url(#ar)"/>
    <line x1="1030" y1="635" x2="1030" y2="775" marker-end="url(#ar)"/>
    <line x1="1250" y1="635" x2="1250" y2="775" marker-end="url(#ar)"/>
  </g>

  <!-- box texts -->
  <g fill="#1A231E" text-anchor="middle">
    <text x="160" y="80" font-size="16" font-weight="700">Utilisateur</text>
    <text x="160" y="103" font-size="13" fill="#5B6660">WhatsApp, 8 pays UEMOA</text>

    <text x="475" y="80" font-size="16" font-weight="700">WasenderAPI</text>
    <text x="475" y="103" font-size="13" fill="#5B6660">session QR, webhooks</text>

    <text x="735" y="80" font-size="16" font-weight="700">CinetPay</text>
    <text x="735" y="103" font-size="13" fill="#5B6660">Wave · Orange Money · MTN · Moov</text>

    <text x="1005" y="80" font-size="16" font-weight="700">API Anthropic</text>
    <text x="1005" y="103" font-size="13" fill="#5B6660">Claude Opus 5 · Haiku 4.5</text>

    <text x="1250" y="80" font-size="16" font-weight="700">Langfuse</text>
    <text x="1250" y="103" font-size="13" fill="#5B6660">traces, coûts, evals</text>

    <text x="170" y="255" font-size="16" font-weight="700">Dashboard admin</text>
    <text x="170" y="277" font-size="13" fill="#2F5FA8">Static Web App</text>
    <text x="170" y="300" font-size="13" fill="#5B6660">templates, file d'envoi, crédits</text>

    <text x="555" y="255" font-size="16" font-weight="700">mblo-api</text>
    <text x="555" y="277" font-size="13" fill="#2F5FA8">Container App · FastAPI</text>
    <text x="555" y="304" font-size="13" fill="#5B6660">webhooks WhatsApp et paiement</text>
    <text x="555" y="326" font-size="13" fill="#5B6660">passerelle + ledger de crédits</text>
    <text x="555" y="348" font-size="13" fill="#5B6660">agent : routeur → analyste → outils</text>
    <text x="555" y="370" font-size="13" fill="#5B6660">worker d'envoi throttlé, 20 msg/min</text>

    <text x="170" y="400" font-size="16" font-weight="700">Job digest et alertes</text>
    <text x="170" y="422" font-size="13" fill="#2F5FA8">Container Apps Job</text>
    <text x="170" y="448" font-size="13" fill="#5B6660">17:00 UTC après clôture</text>
    <text x="170" y="470" font-size="13" fill="#5B6660">watchlist : variation &gt; 3 %</text>
    <text x="170" y="492" font-size="13" fill="#5B6660">écrit l'outbox, n'envoie rien</text>

    <text x="170" y="592" font-size="16" font-weight="700">Key Vault</text>
    <text x="170" y="615" font-size="13" fill="#5B6660">clés API, secrets</text>

    <text x="555" y="530" font-size="16" font-weight="700">PostgreSQL Flexible Server</text>
    <text x="555" y="556" font-size="13" fill="#5B6660">cours, indicateurs, fondamentaux, news</text>
    <text x="555" y="578" font-size="13" fill="#5B6660">utilisateurs, watchlist, ledger crédits</text>
    <text x="555" y="600" font-size="13" fill="#5B6660">mémoire conversations, outbox</text>
    <text x="555" y="622" font-size="13" fill="#5B6660">unicité ticker + date de séance</text>

    <text x="1060" y="400" font-size="16" font-weight="700">Blob Storage</text>
    <text x="1060" y="423" font-size="13" fill="#5B6660">HTML et PDF bruts</text>
    <text x="1060" y="445" font-size="13" fill="#5B6660">audit, fixtures de tests</text>

    <text x="1130" y="550" font-size="16" font-weight="700">Job ingestion</text>
    <text x="1130" y="572" font-size="13" fill="#2F5FA8">Container Apps Job · cron 16:30 UTC, lun–ven</text>
    <text x="1130" y="597" font-size="13" fill="#5B6660">scraper déterministe, sans LLM</text>
    <text x="1130" y="619" font-size="13" fill="#5B6660">PER, rendement, MM20/50, RSI, 52 semaines</text>

    <text x="1030" y="805" font-size="16" font-weight="700">brvm.org</text>
    <text x="1030" y="828" font-size="13" fill="#5B6660">cours, volumes, indices</text>
    <text x="1250" y="805" font-size="16" font-weight="700">SikaFinance</text>
    <text x="1250" y="828" font-size="13" fill="#5B6660">BPA, dividendes, news</text>
  </g>

  <!-- arrow labels -->
  <g font-size="13">
    <text x="320" y="76" text-anchor="middle" fill="#1E7A4C">messages, vocaux</text>
    <text x="450" y="20" text-anchor="middle" fill="#1E7A4C">paie 500 FCFA via lien Mobile Money</text>
    <text x="422" y="182" text-anchor="end" fill="#1E7A4C">webhook entrant</text>
    <text x="528" y="182" text-anchor="start" fill="#1E7A4C">réponses, digests</text>
    <text x="708" y="182" text-anchor="start" fill="#1A231E">webhook paiement : +1000 crédits</text>
    <text x="870" y="262" text-anchor="middle" fill="#1A231E">Opus 5 analyse · Haiku 4.5 routage</text>
    <text x="1000" y="340" text-anchor="middle" fill="#1A231E">traces, coût par utilisateur</text>
    <text x="565" y="450" text-anchor="start" fill="#1A231E">outils SQL, crédits, mémoire</text>
    <text x="330" y="265" text-anchor="middle" fill="#1A231E">API admin</text>
    <text x="340" y="520" text-anchor="start" fill="#1A231E">écrit l'outbox</text>
    <text x="840" y="565" text-anchor="middle" fill="#1A231E">cours + indicateurs du jour</text>
    <text x="1068" y="495" text-anchor="start" fill="#1A231E">brut</text>
    <text x="1038" y="710" text-anchor="start" fill="#1A231E">GET HTML</text>
    <text x="1258" y="710" text-anchor="start" fill="#1A231E">GET HTML</text>
  </g>

  <!-- legend -->
  <g font-size="13">
    <line x1="50" y1="862" x2="90" y2="862" stroke="#1E7A4C" stroke-width="2"/>
    <text x="98" y="866" fill="#1A231E">parcours du citoyen</text>
    <line x1="260" y1="862" x2="300" y2="862" stroke="#1A231E" stroke-width="1.5"/>
    <text x="308" y="866" fill="#1A231E">flux internes et externes</text>
  </g>
</svg>
